name: Update IPTV Playlist

on:
  schedule:
    # Twice a day: 02:00 and 14:00 UTC
    # = 07:00 / 19:00 PKT, 07:30 / 19:30 IST
    - cron: '0 2,14 * * *'
  push:
    branches: [main]
    paths:
      - 'build.py'
      - 'config.json'
      - 'requirements.txt'
      - 'working_new_channels.json'
      - '.github/workflows/update.yml'
  workflow_dispatch:
    inputs:
      skip_verify:
        description: 'Skip stream verification (fast dry run)'
        type: boolean
        default: false

# Queue runs per workflow/ref without aggressively aborting hosted runner allocation
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate config
        run: python -c "import json; json.load(open('config.json', encoding='utf-8'))"

      - name: Build playlist
        id: build
        env:
          SKIP_VERIFY: ${{ inputs.skip_verify }}
        run: |
          set -o pipefail
          EXTRA_ARGS=""
          if [ "$SKIP_VERIFY" = "true" ]; then
            EXTRA_ARGS="--no-verify"
          fi
          python build.py $EXTRA_ARGS 2>&1 | tee build.log

      - name: Summarise run
        if: always()
        run: python summarize.py >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_id }}
          path: |
            build.log
            reports/
          retention-days: 14

      - name: Commit and push changes
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u playlists/ reports/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          COUNT=$(grep -c '^#EXTINF' playlist.m3u || echo 0)
          git commit -m "Auto-update IPTV playlist: ${COUNT} channels [skip ci]"

          # The scheduled run on the other side of the day may have pushed first.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected, rebasing (attempt ${attempt})..."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          done
          echo "::error::Could not push after 3 attempts."
          exit 1

